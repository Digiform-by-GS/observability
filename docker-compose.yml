name: observability-baseline

networks:
  obs:
    driver: bridge

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:
  pyroscope-data:

services:
  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [obs]

  tempo:
    image: grafana/tempo:2.10.5
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [obs]

  mimir:
    image: grafana/mimir:3.0.6
    container_name: mimir
    command: ["-config.file=/etc/mimir/mimir-config.yaml"]
    volumes:
      - ./infra/mimir/mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"
    networks: [obs]

  # Continuous profiler. Answers "which function is allocating/burning CPU?" —
  # a question metrics and traces structurally cannot answer, since heap gauges
  # are per-process and spans measure time, not allocation.
  pyroscope:
    image: grafana/pyroscope:2.1.1
    container_name: pyroscope
    volumes:
      - pyroscope-data:/data
    ports:
      - "4040:4040"
    networks: [obs]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      # Referenced as ${env:DEPLOYMENT_ENVIRONMENT} in the collector config.
      # Override per environment; the collector fails to start if it is unset.
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # self-metrics
    networks: [obs]
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [obs]
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started
