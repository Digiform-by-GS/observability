name: observability-baseline

networks:
  obs:
    driver: bridge

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:
  pyroscope-data:
  postgres-data:

services:
  # ---------------------------------------------------------------------------
  # Application infrastructure (Phase 2). These are the things the app talks to,
  # as opposed to the telemetry backends below. Both are monitored two ways:
  # server-side health via collector receivers, and per-request impact via
  # client spans from the app. You need both — server-side says "Redis is
  # healthy", only client spans reveal one endpoint issuing 400 sequential GETs.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: redis
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks: [obs]
    # Unlike the distroless LGTM images, these app-infra images ship a shell,
    # so a healthcheck works — and go-service depends on service_healthy so it
    # doesn't race ahead of a not-yet-listening dependency on a cold start.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # The -management tag matters: the rabbitmq receiver scrapes the management
  # HTTP API on 15672, NOT the AMQP port 5672. Plain `rabbitmq:4-alpine` has no
  # management plugin and the receiver would fail every scrape.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    mem_limit: 640m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"    # AMQP — what the app connects to
      - "15672:15672"  # management UI + API — what the collector scrapes
    networks: [obs]
    healthcheck:
      # check_port_connectivity, NOT ping: `ping` confirms the Erlang node is up,
      # but the AMQP listener on 5672 starts slightly later, so a consumer that
      # dials on ping-success still gets "connection refused". This checks the
      # ports are actually accepting.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    mem_limit: 384m
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [obs]

  tempo:
    image: grafana/tempo:2.10.5
    container_name: tempo
    mem_limit: 512m
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [obs]

  mimir:
    image: grafana/mimir:3.0.6
    container_name: mimir
    mem_limit: 512m
    command: ["-config.file=/etc/mimir/mimir-config.yaml"]
    volumes:
      - ./infra/mimir/mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"
    networks: [obs]

  # Continuous profiler. Answers "which function is allocating/burning CPU?" —
  # a question metrics and traces structurally cannot answer, since heap gauges
  # are per-process and spans measure time, not allocation.
  pyroscope:
    image: grafana/pyroscope:2.1.1
    container_name: pyroscope
    mem_limit: 384m
    # Pyroscope ships NO time-based retention. Its only default is a disk-pressure
    # policy that stops just 10 GiB short of full, so on a shared host it grows
    # until it starves Loki/Tempo/Mimir — none of which have that protection, and
    # all of which would simply fail to write. It was already the largest consumer
    # here by 16x while carrying the least-consulted signal.
    #
    # 168h matches Loki and Tempo: profiles answer "what allocated this, recently",
    # and nobody reads a month-old flame graph.
    #
    # The image's default Cmd is the config file flag, so it must be repeated —
    # overriding `command` replaces it, and dropping it stops the server booting.
    command:
      - -config.file=/etc/pyroscope/config.yaml
      - -compactor.blocks-retention-period=168h
    volumes:
      - pyroscope-data:/data
    ports:
      - "4040:4040"
    networks: [obs]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: otel-collector
    mem_limit: 512m
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      # Referenced as ${env:DEPLOYMENT_ENVIRONMENT} in the collector config.
      # Override per environment; the collector fails to start if it is unset.
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
      # Consumed by the postgresql receiver. Local dev credentials only — the
      # whole stack is unauthenticated and must not be exposed off-localhost.
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # Consumed by the rabbitmq receiver (management API on 15672).
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "4319:4319"     # OTLP HTTP, browser/RUM only (CORS enabled)
      - "8888:8888"     # self-metrics
    networks: [obs]
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    mem_limit: 320m
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [obs]
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

  # Example Go service. Runs on the `obs` network (not the host) so it reaches
  # the collector by DNS name — and so the redis/rabbitmq receivers added in
  # later phases can reach their targets the same way. Build it explicitly:
  #   docker compose build go-service && docker compose up -d go-service
  go-service:
    build:
      context: .
      dockerfile: examples/go-service/Dockerfile
    image: digiform/go-service:dev
    container_name: go-service
    mem_limit: 160m
    environment:
      OTEL_SERVICE_NAME: go-service
      OTEL_SERVICE_VERSION: 0.1.0
      OTEL_DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
      # Container DNS, not localhost — this is the whole point of containerising.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "8090"
      # Both optional: unset either one and the matching route reports itself
      # disabled rather than the service refusing to boot.
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    ports:
      - "8090:8090"
    networks: [obs]
    depends_on:
      otel-collector:
        condition: service_started
      # service_healthy, not service_started: these must be accepting
      # connections before go-service dials them, or openDeps/openMessaging
      # fail fatally on a cold start (RabbitMQ alone takes ~20s to be ready).
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
