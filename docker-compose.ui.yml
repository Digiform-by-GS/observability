# Platform front door. A separate overlay from the stack itself, for the same
# reason the onboarding agent is: it can be rebuilt, stopped or dropped without
# touching the backends that teams depend on.
#
#   docker compose -f docker-compose.yml -f docker-compose.platform.yml \
#                  -f docker-compose.ui.yml up -d --build platform-ui
#
# What it is: the service catalogue with signal coverage, plus Grafana panels
# embedded per service. What it is NOT: a replacement for Grafana. It answers
# "which services exist, who owns them, and is each one actually sending all
# three signals" - the question Grafana answers worst, because every RED panel
# there is built from spans and a service sending no logs looks perfectly
# healthy on all of them.
services:
  platform-ui:
    build:
      context: ./services/platform-ui
    image: digiform/platform-ui:dev
    container_name: platform-ui
    restart: unless-stopped
    mem_limit: 192m
    environment:
      # BROWSER-facing. This ends up in <iframe src>, so a container name here
      # would resolve only inside the Docker network and every panel would be
      # blank for every real user while looking fine from inside the host.
      GRAFANA_URL: ${PUBLIC_GRAFANA_URL:?set PUBLIC_GRAFANA_URL in .env - the address a BROWSER uses}
      # Server-side. Container DNS is correct for these two.
      MIMIR_URL: http://mimir:9009
      LOKI_URL: http://loki:3100
      # Mimir takes one X-Scope-OrgID per query and accepts a pipe-separated list
      # to read across tenants - the same trick Grafana's provisioned datasource
      # uses. Keep this in step with infra/tenants.yaml as teams are added, or a
      # new team's services are simply missing from the catalogue.
      MIMIR_TENANTS: ${MIMIR_TENANTS:-platform|unattributed|gudangsolusi|anonymous}
      TEAMS_FILE: /app/teams.json
    volumes:
      # Generated by scripts/gen-tenants.py. Read-only: this service never writes.
      - ./infra/teams.json:/app/teams.json:ro
    networks: [obs]
    ports:
      - "8200:8200"
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
