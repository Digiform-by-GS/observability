# Upstream version drift, reported as an issue rather than a build failure.
#
# Deliberately NOT part of CI. The pins in compat.json are asserted against this
# repo's own packages by scripts/check-compat.py, which is PR-blocking because
# internal disagreement is always a defect. Upstream publishing a new release is
# not a defect, and failing unrelated PRs the morning @vercel/otel ships a patch
# would train everyone to ignore a red build.
#
# What this catches is the slower failure: a pin quietly rotting until the agent
# is installing something a year old. The frontend onboarding picked
# @vercel/otel 1.10 when 2.1.3 was current, so "nobody noticed the pin aged" is
# a demonstrated failure mode here, not a hypothetical one.
name: Compat staleness

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  staleness:
    name: Check pins against upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pins with upstream latest
        id: check
        run: |
          set -euo pipefail
          compat=plugin/skills/onboard/references/compat.json
          report=""

          pinned_vercel=$(python3 -c "import json;print(json.load(open('$compat'))['nextjs']['version'].lstrip('^~'))")
          latest_vercel=$(curl -fsSL https://registry.npmjs.org/@vercel/otel/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
          if [ "$pinned_vercel" != "$latest_vercel" ]; then
            report="${report}- \`@vercel/otel\`: pinned **${pinned_vercel}**, latest **${latest_vercel}**"$'\n'
          fi

          # The Go module proxy wants a lowercase path.
          otel_pin=$(python3 -c "import json;print(json.load(open('$compat'))['go']['raisesOtelTo'])")
          otel_latest=$(curl -fsSL https://proxy.golang.org/go.opentelemetry.io/otel/@latest | python3 -c "import json,sys;print(json.load(sys.stdin)['Version'])")
          if [ "$otel_pin" != "$otel_latest" ]; then
            report="${report}- \`go.opentelemetry.io/otel\`: pinned **${otel_pin}**, latest **${otel_latest}**"$'\n'
          fi

          if [ -z "$report" ]; then
            echo "every pin is current"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "Upstream has moved past the pins in \`$compat\`."
              echo ""
              printf '%s' "$report"
              echo ""
              echo "Bumping is a judgement call, not automatic - the OTel Go contrib line and"
              echo "\`go.opentelemetry.io/otel\` must move together, and the Node wrapper pins a"
              echo "compatible SDK set rather than individual packages. Update the package, the"
              echo "README table, and \`compat.json\` in one PR; \`scripts/check-compat.py\` enforces"
              echo "that they agree."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.check.outputs.body }}
        run: |
          set -euo pipefail
          title="Compat pins are behind upstream"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$title" --body "$BODY" --label dependencies || \
              gh issue create --title "$title" --body "$BODY"
          fi
