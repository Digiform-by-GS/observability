name: CI

# Runs the test suites and linters that this repo relies on as regression
# guards — the no-op-propagator test, the span-links test, sloglint, the
# log-correlation test. They only guard anything if they actually run, which is
# the entire point of this workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node (@digiform-by-gs/observability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build wrapper
        run: npm run -w @digiform-by-gs/observability build
      - name: Test wrapper (vitest)
        run: npm run -w @digiform-by-gs/observability test
      - name: Typecheck wrapper
        run: npm run -w @digiform-by-gs/observability typecheck

      # Browser/RUM package. Build before test, same as the wrapper.
      - name: Build browser package
        run: npm run -w @digiform-by-gs/observability-browser build
      - name: Test browser package (vitest)
        run: npm run -w @digiform-by-gs/observability-browser test
      - name: Typecheck browser package
        run: npm run -w @digiform-by-gs/observability-browser typecheck
      - name: Typecheck examples
        run: |
          npm run -w @digiform-by-gs/nodejs-sample typecheck
          npm run -w @digiform-by-gs/microservices-demo typecheck

  go:
    name: Go (observability-go + examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # OTel v1.44 requires Go >= 1.25 (see CLAUDE.md).
          go-version: "1.26"
          cache-dependency-path: |
            packages/observability-go/go.sum
            packages/observability-go/httpx/go.sum
            examples/go-service/go.sum
            examples/go-echo-service/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l packages/observability-go examples/go-service examples/go-echo-service)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Test module
        working-directory: packages/observability-go
        run: go test -race ./...

      # httpx is a separate module. Its tests are the product: they assert that a
      # server span is named "GET /orders/{id}" on all four routers, which is the
      # difference between bounded metric cardinality and Mimir rejecting writes
      # for every tenant on the platform.
      - name: Test httpx module
        working-directory: packages/observability-go/httpx
        run: go test -race ./...

      - name: Build + test example (chi)
        working-directory: examples/go-service
        run: |
          go build ./...
          go test -race ./...

      - name: Build example (Echo)
        working-directory: examples/go-echo-service
        run: go build ./...

      # sloglint (context:all) lives in .golangci.yml and is load-bearing, not
      # stylistic — it catches uncorrelated logs the compiler accepts. Lint both
      # modules; they are separate go.mod roots.
      - name: Lint module
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: packages/observability-go
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: Lint example (chi)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: examples/go-service
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: Lint example (Echo)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: examples/go-echo-service
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: Lint httpx module
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: packages/observability-go/httpx
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: Build rehearsal fixture (plain-chi)
        working-directory: examples/plain-chi
        run: go build ./...

  compat:
    name: Compatibility manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compat.json is the only version source the onboarding agent can see - the
      # runner mounts plugin/ and nothing else. When it drifts from the packages,
      # the agent installs versions that do not exist or do not work, and the
      # first symptom is a client's build failing. Both onboarding defects shipped
      # so far were a wrong version picked where nothing authoritative said
      # otherwise, which is exactly what this guards.
      - name: compat.json agrees with the packages
        run: python3 scripts/check-compat.py

  generated:
    name: Generated config matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gen-tenants.py parses a manifest, so it needs a real YAML parser.
      # check-compat.py deliberately regexes instead, but it only asserts a few
      # values inside a file a human maintains - parsing nested structure with
      # regex would be a parser with no error messages.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Every per-tenant block across the collector, Mimir, Loki and Tempo is
      # generated from infra/tenants.yaml. Hand-editing one of the outputs would
      # survive review and then be silently reverted by the next generator run.
      - name: tenant config matches the manifest
        run: python3 scripts/gen-tenants.py --check

      # This guard did not exist before, and the dashboards could already drift
      # from their generator unnoticed. A second generator makes that worse.
      - name: dashboards match their generator
        run: |
          python3 scripts/gen-dashboards.py
          git diff --exit-code -- infra/grafana/provisioning/dashboards/ \
            || { echo "^ dashboards differ from gen-dashboards.py output"; exit 1; }

      # All three backends load their per-tenant overrides with a STRICT decoder:
      # one unknown key is a hard load failure at runtime, not a warning. Parsing
      # them here turns that into a failed build instead of a backend that will
      # not start.
      - name: per-tenant overrides parse
        run: |
          for f in infra/mimir/runtime.yaml infra/loki/runtime.yaml infra/tempo/overrides.yaml; do
            python3 -c "import sys,yaml; d=yaml.safe_load(open(sys.argv[1]));
          assert isinstance(d.get('overrides'), dict) and d['overrides'], 'no overrides map'
          print('  ok', sys.argv[1], '->', ', '.join(sorted(d['overrides'])))" "$f"
          done

      # The decisive check: the generated fragment is only ever used merged with
      # the base config, so validate the merge with the real collector binary at
      # the pinned version. Catches an undefined exporter, a pipeline the routing
      # table names but nothing defines, and a mistyped OTTL function - each of
      # which otherwise surfaces as a collector that refuses to start on the VM.
      - name: merged collector config is valid
        run: ./scripts/check-collector-merge.sh

  plugin:
    name: Plugin (observability-onboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugin/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugin/skills/dashboards/assets/service-dashboard.json > /dev/null

      - name: Skills have frontmatter
        run: |
          fail=0
          for f in plugin/skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "missing frontmatter: $f"; fail=1; }
            sed -n '2,6p' "$f" | grep -q '^name:' || { echo "missing name: $f"; fail=1; }
            sed -n '2,8p' "$f" | grep -q '^description:' || { echo "missing description: $f"; fail=1; }
          done
          exit $fail

      # The runner passes --plugin-dir to the agent. Pointing it at the PARENT
      # of the plugin loads nothing and raises no error, so the agent runs with
      # no skills at all - which burned three onboarding attempts before a probe
      # asked the agent what it could see and it answered NONE.
      - name: runner points --plugin-dir at an actual plugin
        run: |
          # Anchor to the flag as used, not as mentioned: the comment above it
          # in run-job.sh contains the same string.
          dir=$(grep -oE '^[[:space:]]*--plugin-dir[[:space:]]+[^[:space:]]+'                   services/onboarding-agent/runner/run-job.sh | awk '{print $2}')
          echo "run-job.sh uses: $dir"
          if [ "$dir" != "/opt/observability-plugin/plugin" ]; then
            echo "unexpected --plugin-dir: $dir"; exit 1
          fi
          # That container path is populated from ./plugin by the Dockerfile,
          # so the manifest must exist here in the repo.
          if [ ! -f plugin/.claude-plugin/plugin.json ]; then
            echo "plugin/.claude-plugin/plugin.json missing"; exit 1
          fi
          echo "  plugin manifest present"

      # The runner may run two non-executing npm forms so it can resolve and lock
      # its dependency choice. A blanket Bash(npm:*) would also permit
      # 'npm install', which runs postinstall scripts from the client's
      # untrusted dependency tree - remote code execution one hop from the
      # shared platform. The narrowness is the whole safety argument, and it is
      # a single character away from being lost.
      - name: runner's npm grant stays narrow
        run: |
          tools=$(grep -oE -- '--allowedTools "[^"]+"' services/onboarding-agent/runner/run-job.sh)
          echo "$tools"
          if echo "$tools" | grep -qE 'Bash\(npm:\*\)|Bash\(npm \*\)'; then
            echo "blanket npm grant - postinstall scripts would execute here"; exit 1
          fi
          for form in 'npm install --package-lock-only --ignore-scripts' 'npm ci --dry-run'; do
            echo "$tools" | grep -qF "Bash($form" || { echo "missing allowed form: $form"; exit 1; }
          done
          echo "  npm grant is limited to the two non-executing forms"

      # ...and that grant only means anything if permissions are actually
      # evaluated. bypassPermissions skips evaluation entirely, so it voids the
      # allowlist above without changing a character of it - which is exactly
      # what happened: the flag sat there while the check above passed, and the
      # agent could run `npm install` the whole time. Probed on 2.1.270: with
      # the flag a non-allowlisted `touch` ran; without it `npm install express`
      # was denied and recorded in .permission_denials. This check is the only
      # thing that makes the one above true.
      - name: runner does not bypass its own allowlist
        run: |
          # Anchored to a real flag: the script carries a DO-NOT-ADD comment
          # naming this flag, and an unanchored grep matches the warning itself.
          if grep -nE '^[[:space:]]*--permission-mode[= ]+bypassPermissions' services/onboarding-agent/runner/run-job.sh; then
            echo "^ bypassPermissions voids --allowedTools; the npm narrowing becomes decoration"; exit 1
          fi
          # The signals contract asks for a path inside the repo, so nothing
          # depends on this - but /out stays granted so an agent that writes its
          # report there anyway is accepted instead of silently losing it.
          grep -qE -- '--add-dir' services/onboarding-agent/runner/run-job.sh \
            || { echo "no --add-dir: a signals report written to /out would be refused"; exit 1; }
          echo "  permissions are enforced, and /out is granted explicitly"

      # DISCOVERED, not listed. This used to be two globs with a comment saying
      # "every shell script in the repo", and it was already untrue when
      # written: services/onboarding-agent/runner/run-job.sh matched neither -
      # the most intricate shell here, and the only one that runs unattended
      # against a stranger's repository. The same comment even records
      # verify-platform.sh drifting to 8 findings "precisely because it was
      # outside this glob", so this is the second time one script sat outside a
      # list nobody re-read. A list of paths is a thing that goes stale; a find
      # cannot.
      #
      # These scripts report PASS/FAIL on whether telemetry works, so a silent
      # logic bug in one is worse than a broken build: it reports success nobody
      # has reason to doubt.
      - name: shellcheck all scripts
        run: |
          mapfile -t SCRIPTS < <(find . -name '*.sh' -not -path './node_modules/*' | sort)
          printf '  %s\n' "${SCRIPTS[@]}"
          # A find that matched nothing would make this step pass while checking
          # nothing at all - the exact failure this job exists to prevent.
          if [ "${#SCRIPTS[@]}" -lt 4 ]; then
            echo "only ${#SCRIPTS[@]} scripts found - the discovery is broken, not the repo"
            exit 1
          fi
          shellcheck "${SCRIPTS[@]}"

      # Skills ship to client repos that have no access to this monorepo, and
      # must not bake in one deployment's addresses. Deployment-specific IPs or
      # references to in-repo docs are self-containment failures.
      - name: Self-containment
        run: |
          fail=0
          if grep -rn '20\.20\.1\.88' plugin/; then
            echo "^ deployment-specific address in plugin/ — endpoints belong in .observability/platform.json"; fail=1
          fi
          if grep -rnE 'developer_guide\.md|platform_guide\.md|deployment_guide\.md|CLAUDE\.md|GUIDE\.md' plugin/skills/; then
            echo "^ skills reference monorepo docs — content must be distilled in, not linked"; fail=1
          fi
          exit $fail
