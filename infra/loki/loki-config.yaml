# Partition logs by tenant, read from X-Scope-OrgID. Loki calls this
# `auth_enabled`, but it enables TENANCY, not authentication - it makes the
# header required and meaningful; it does not verify who sent it.
auth_enabled: true

# Per-tenant limits, hot-reloaded. Generated by scripts/gen-tenants.py; strict
# loader, so an unknown key stops Loki rather than being ignored.
runtime_config:
  file: /etc/loki/runtime.yaml
  period: 10s

querier:
  # Allow one query to span several tenants, so the single shared Grafana can
  # read every team from one datasource. Results gain a __tenant_id__ label.
  #
  # NOTE this does not extend to /loki/api/v1/tail, which returns HTTP 400 for a
  # multi-tenant header - hence the separate single-tenant `loki-tail`
  # datasource for Explore's Live button.
  multi_tenant_queries_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  # Without retention_enabled the `retention_period: 168h` below is inert —
  # the compactor never deletes anything and disk grows unbounded.
  retention_enabled: true
  compaction_interval: 10m

limits_config:
  metric_aggregation_enabled: true
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: false
  retention_period: 168h

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
