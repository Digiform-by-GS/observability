stream_over_http_enabled: true

# Partition traces by tenant, read from X-Scope-OrgID.
#
# ORDERING MATTERS AND THIS ONE MUST LAND BEFORE MIMIR'S. Tempo's metrics
# generator adds X-Scope-OrgID to its own remote_write to Mimir, but ONLY in
# multi-tenant mode; single-tenant, it deliberately sends no header at all. So
# enabling multitenancy on Mimir first makes every span-metric and service-graph
# write 401. The collector is not in that write path, so no exporter metric and
# no existing alert would fire - every RED dashboard simply goes quiet while
# looking calm, and the only evidence is a line in this container's log.
#
# For the same reason, do NOT add a `headers:` block to metrics_generator's
# remote_write below. Tempo honours an operator-set header and refuses to
# overwrite it, logging only at Info - which would land every tenant's generator
# metrics in one hardcoded Mimir tenant, silently.
multitenancy_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Must match Loki's retention (168h). At the old 1h a trace was deleted
    # before you could investigate it, and event-driven flows — retries, DLQ
    # replays — routinely exceed an hour, so exactly the traces worth keeping
    # were the ones being dropped.
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  # NO per_tenant_override_config, and that is load-bearing rather than an
  # omission. Tempo's per-tenant overrides replace the ENTIRE defaults object
  # for that tenant, not merely the sub-blocks the entry names. A tenant with
  # only an `ingestion:` entry therefore loses `metrics_generator.processors`
  # too, the generator silently stops producing for it, and every RED
  # dashboard, the service graph and all exemplars go blank with nothing
  # logged and no alert. That is exactly what happened here: span-metrics were
  # dead platform-wide for six days.
  #
  # Proven rather than reasoned: with an overrides file, a tenant WITH an
  # entry produced zero generator series while a tenant with NO entry produced
  # 45 from identical spans.
  #
  # Per-tenant Tempo limits also buy nothing today, because traces are
  # deliberately NOT routed - every span lands in one tenant, so a per-tenant
  # trace limit has no second tenant to distinguish. Mimir's and Loki's
  # per-tenant limits are unaffected and still generated.
  #
  # IF TRACE ROUTING IS EVER ENABLED and per-tenant Tempo limits are wanted
  # again, every entry must carry the COMPLETE object - ingestion AND the whole
  # metrics_generator block including processors and every dimension below -
  # or this failure returns.
  defaults:
    # Tempo's own ingestion defaults, stated rather than inherited.
    #
    # An overrides block REPLACES the built-in defaults instead of merging with
    # them, so a `defaults:` section that mentions only metrics_generator leaves
    # every ingestion field at its zero value - and a zero burst_size_bytes
    # rejects every write no matter what the rate limit says. Single-tenant mode
    # never exercised this path, so it appeared the moment multitenancy was
    # enabled and cost ~10 minutes of dropped traces on the platform.
    #
    # The error it produces names a RATE limit, which sends you to look at the
    # rate. The rate was fine. Write the whole group, always.
    ingestion:
      rate_limit_bytes: 15000000
      burst_size_bytes: 20000000
      max_traces_per_user: 10000
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
      generate_native_histograms: both
      # The per-tenant generator cap, applied UNIFORMLY from here rather than
      # per tenant in the generated overrides file.
      #
      # It lived there once and wiped this entire block: a per-tenant overrides
      # entry REPLACES the defaults instead of merging, so a metrics_generator
      # block containing only max_active_series left `processors` empty for
      # every tenant. The generator then did nothing at all, and span-metrics
      # stopped platform-wide for six days - no RED dashboards, no service
      # graph, no exemplars, and four alert rules sitting at noDataState: OK.
      #
      # Defaults are the per-tenant fallback, so every tenant still gets this
      # cap; it is just the same number for all of them. Differentiating it
      # again means emitting this WHOLE block per tenant - processors,
      # histograms and every dimension below - and accepting a second place for
      # them to drift. Do not pay that until a tenant genuinely needs a
      # different cap.
      max_active_series: 10000
      # Add messaging attributes as span-metrics dimensions so the async flow is
      # queryable even though it does NOT appear as service-graph edges.
      #
      # IMPORTANT — the service graph pairs spans WITHIN ONE TRACE. Producers and
      # consumers are in separate traces (span links, by design — see the amqp
      # package), so RabbitMQ edges are STRUCTURALLY ABSENT from the node graph.
      # This is correct, not broken. Do not "fix" it by switching the consumer to
      # parent-child: that reintroduces unbounded-duration traces, fan-out
      # branching, and retention fragments. Build the async view from
      # span-metrics filtered to span_kind=SPAN_KIND_PRODUCER|SPAN_KIND_CONSUMER
      # and the dimensions below.
      processor:
        span_metrics:
          dimensions:
            - messaging.system
            - messaging.destination.name
            - messaging.operation.type
            # Resource attribute, not a span attribute. Without it every
            # environment of a service collapses into one series: costwise-frontend
            # in development and in staging become indistinguishable on every RED
            # dashboard, even though the apps set the attribute correctly and it is
            # visible on the raw traces. Setting deployment.environment per
            # deployment only pays off once it reaches the metrics.
            #
            # This does not multiply series - a given service reports one
            # environment - it disambiguates ones that were previously merged.
            - deployment.environment
            # The APPLICATION a service belongs to (OTel's service.namespace),
            # so a dashboard can show "costwise" rather than four unrelated
            # service names. Same reasoning as deployment.environment directly
            # above: a given service reports ONE namespace, so this does not
            # multiply series - it separates ones that were previously merged.
            # Without it the grouping exists on SDK metrics but not on the RED
            # dashboards, which is where it would actually be used.
            - service.namespace
            # Which TEAM owns the service, so the RED dashboards can be filtered
            # by team and not only by service. The tenant is the team, so this
            # is also recoverable from __tenant_id__ via query federation - but
            # that is a Mimir query-path artifact rather than a label the data
            # carries, and it would vanish if federation were reconfigured.
            #
            # One team per service, so like the two dimensions above this does
            # not multiply series.
            - team

usage_report:
  reporting_enabled: false
