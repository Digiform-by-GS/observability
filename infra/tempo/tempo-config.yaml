stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Must match Loki's retention (168h). At the old 1h a trace was deleted
    # before you could investigate it, and event-driven flows — retries, DLQ
    # replays — routinely exceed an hour, so exactly the traces worth keeping
    # were the ones being dropped.
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
      generate_native_histograms: both
      # Add messaging attributes as span-metrics dimensions so the async flow is
      # queryable even though it does NOT appear as service-graph edges.
      #
      # IMPORTANT — the service graph pairs spans WITHIN ONE TRACE. Producers and
      # consumers are in separate traces (span links, by design — see the amqp
      # package), so RabbitMQ edges are STRUCTURALLY ABSENT from the node graph.
      # This is correct, not broken. Do not "fix" it by switching the consumer to
      # parent-child: that reintroduces unbounded-duration traces, fan-out
      # branching, and retention fragments. Build the async view from
      # span-metrics filtered to span_kind=SPAN_KIND_PRODUCER|SPAN_KIND_CONSUMER
      # and the dimensions below.
      processor:
        span_metrics:
          dimensions:
            - messaging.system
            - messaging.destination.name
            - messaging.operation.type
            # Resource attribute, not a span attribute. Without it every
            # environment of a service collapses into one series: costwise-frontend
            # in development and in staging become indistinguishable on every RED
            # dashboard, even though the apps set the attribute correctly and it is
            # visible on the raw traces. Setting deployment.environment per
            # deployment only pays off once it reaches the metrics.
            #
            # This does not multiply series - a given service reports one
            # environment - it disambiguates ones that were previously merged.
            - deployment.environment

usage_report:
  reporting_enabled: false
