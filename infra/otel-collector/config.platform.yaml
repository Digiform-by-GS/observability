# Collector config for the SHARED PLATFORM deployment (the VM), as opposed to a
# developer laptop.
#
# Two differences from config.yaml, both consequences of "many teams, one box":
#
#   1. No redis/postgresql/rabbitmq receivers. Those scrape the demo fixtures
#      that ship with the examples; the platform host does not run them, so the
#      receivers would log connection failures forever and scrape nothing.
#
#   2. A resource-pruning processor on the metrics pipeline (see below). This is
#      the single highest-leverage guardrail on a shared host.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrapes the platform's own components. Without this there is no way to see
  # ingest failures, rejected writes, or a backend that has stopped answering —
  # the stack can be losing every signal while its dashboards look calm, because
  # dashboards are built from the very data that is not arriving.
  #
  # The keep-list is not optional. These four endpoints expose ~11,700 metric
  # lines between them; ingesting that wholesale would add roughly 8% of the
  # 150k series cap in infrastructure alone, which is precisely the failure the
  # cap exists to prevent. The allowlist below holds it to a couple of hundred.
  prometheus/platform:
    config:
      scrape_configs:
        - job_name: platform-backends
          scrape_interval: 30s
          static_configs:
            - targets: [mimir:9009, loki:3100, tempo:3200, pyroscope:4040]
          metric_relabel_configs:
            - source_labels: [__name__]
              action: keep
              # Several of these do not exist yet: Prometheus counters are only
              # created on first occurrence, so the discard/failure families
              # appear the moment something actually goes wrong. Listing them
              # now means they are captured then, rather than discovered missing
              # during an incident.
              regex: >-
                cortex_ingester_memory_series|cortex_discarded_samples_total|cortex_distributor_samples_in_total|cortex_ingester_ingested_samples_failures_total|loki_discarded_samples_total|loki_discarded_bytes_total|loki_distributor_bytes_received_total|tempo_discarded_spans_total|tempo_distributor_spans_received_total|tempo_distributor_bytes_received_total|process_resident_memory_bytes
        - job_name: otel-collector
          scrape_interval: 30s
          # The collector scrapes itself. This is the highest-value target of
          # the five: if the collector cannot export, every signal is being
          # dropped on the floor, and nothing downstream can report that because
          # nothing downstream is receiving anything.
          static_configs:
            - targets: [localhost:8888]
          metric_relabel_configs:
            - source_labels: [__name__]
              action: keep
              regex: >-
                otelcol_exporter_send_failed_.*|otelcol_exporter_enqueue_failed_.*|otelcol_exporter_queue_size|otelcol_exporter_queue_capacity|otelcol_receiver_refused_.*|otelcol_processor_dropped_.*

processors:
  memory_limiter:
    # Soft limit kept BELOW the container's mem_limit so this graceful limiter —
    # which starts refusing and forcing GC — trips before the kernel OOM killer.
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  resource:
    attributes:
      # `insert` (not upsert) so a value the app already set wins.
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert

  # ---------------------------------------------------------------------------
  # Cardinality guardrail. METRICS PIPELINE ONLY — traces and logs keep every
  # attribute, because there the per-instance detail is exactly what you want
  # when debugging, and neither backend indexes on it the way Mimir does.
  #
  # The exporter below sets `resource_to_telemetry_conversion: enabled`, which
  # promotes EVERY resource attribute to a Prometheus label. Combined with the
  # OTel SDK default of generating a fresh `service.instance.id` UUID on every
  # process start, an app that restarts 20 times in a day leaves 20 dead copies
  # of its entire metric set behind — and on a shared platform, that multiplies
  # by the number of teams. Aggregating by service.name is what you actually
  # want here; per-instance breakdown belongs in traces.
  #
  # The rest are stable-but-useless as labels: they never vary within a service
  # yet widen every series, and process.pid/container.id churn on restart the
  # same way service.instance.id does.
  resource/prune-metric-labels:
    attributes:
      - key: service.instance.id
        action: delete
      - key: process.pid
        action: delete
      - key: process.command_line
        action: delete
      - key: process.command_args
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.runtime.description
        action: delete
      - key: container.id
        action: delete
      - key: host.id
        action: delete
      - key: os.description
        action: delete
      - key: telemetry.sdk.version
        action: delete
      - key: telemetry.distro.version
        action: delete

  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlphttp/traces:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, resource/prune-metric-labels, batch]
      exporters: [prometheusremotewrite]

    # Platform self-monitoring rides a SEPARATE pipeline, following the same
    # reasoning the infra pipeline used: a stalled scrape must not apply
    # backpressure to the OTLP pipelines carrying tenants' telemetry.
    #
    # It deliberately does NOT include resource/prune-metric-labels. The
    # prometheus receiver encodes the scrape target as service.instance.id
    # (mimir:9009, loki:3100, ...), and resource_to_telemetry_conversion turns
    # that into a label. Pruning it — correct for app metrics, where it is a
    # per-process UUID that churns on restart — would collapse all five targets
    # into one indistinguishable series. Here it is the target's identity and
    # is bounded at five values.
    metrics/platform:
      receivers: [prometheus/platform]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
