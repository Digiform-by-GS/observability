receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    # Raised from 512: the infra receivers (prometheus/redis/rabbitmq) added in
    # phase 4 share this process with the OTLP pipelines.
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256
  resource:
    attributes:
      # `insert` (not upsert) so a value the app already set wins. Hardcoding
      # this meant infra metrics said `dev` while app metrics said `staging`,
      # and every environment-filtered dashboard silently showed half the data.
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlphttp/traces:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
