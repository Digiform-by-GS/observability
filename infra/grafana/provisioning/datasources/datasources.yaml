apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      timeout: 60
      maxLines: 1000
      derivedFields:
        # trace_id arrives as OTLP structured metadata (not in the log body), so
        # match it by metadata key rather than a regex over the line.
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View Trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
      # Trace → profile. NB: this correlates by service + the span's time
      # window, not by exact span — per-span profile linking needs a span-
      # profiles integration, which has no published Node.js package (the
      # otelpyroscope package is Go-only). Still enough to answer "what was
      # this service allocating while that request was slow?".
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: 'memory:inuse_space:bytes:inuse_space:bytes'
        tags:
          - key: service.name
            value: service_name
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
      search:
        hide: false
      streamingEnabled:
        search: true

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
    editable: true

  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      manageAlerts: false
      prometheusType: Mimir
      prometheusVersion: 3.0.0
      # Tempo's metrics generator names the exemplar label `traceID` (camelCase),
      # not `trace_id`. A mismatch here yields a silently dead exemplar link.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
