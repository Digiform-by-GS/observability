apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
      timeout: 60
      maxLines: 1000
      derivedFields:
        # trace_id arrives as OTLP structured metadata (not in the log body), so
        # match it by metadata key rather than a regex over the line.
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View Trace
    # Every tenant this datasource may read, plus the legacy single-tenant
    # id for data written before the cutover. Generated from
    # infra/tenants.yaml; `gen-tenants.py --check` fails if they disagree.
    # A TENANT MISSING HERE IS INVISIBLE IN GRAFANA while still being
    # written, which is the quietest way to lose a team's telemetry.
    secureJsonData:
      httpHeaderValue1: 'platform|unattributed|gudangsolusi|fake'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
      # Trace → profile. NB: this correlates by service + the span's time
      # window, not by exact span — per-span profile linking needs a span-
      # profiles integration, which has no published Node.js package (the
      # otelpyroscope package is Go-only). Still enough to answer "what was
      # this service allocating while that request was slow?".
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: 'memory:inuse_space:bytes:inuse_space:bytes'
        tags:
          - key: service.name
            value: service_name
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
      search:
        hide: false
      streamingEnabled:
        search: true
    # Every tenant this datasource may read, plus the legacy single-tenant
    # id for data written before the cutover. Generated from
    # infra/tenants.yaml; `gen-tenants.py --check` fails if they disagree.
    # A TENANT MISSING HERE IS INVISIBLE IN GRAFANA while still being
    # written, which is the quietest way to lose a team's telemetry.
    secureJsonData:
      httpHeaderValue1: 'platform|unattributed|gudangsolusi|single-tenant'

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
    editable: false

  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
      httpMethod: POST
      timeInterval: 15s
      manageAlerts: false
      prometheusType: Mimir
      prometheusVersion: 3.0.0
      # Tempo's metrics generator names the exemplar label `traceID` (camelCase),
      # not `trace_id`. A mismatch here yields a silently dead exemplar link.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
    # Every tenant this datasource may read, plus the legacy single-tenant
    # id for data written before the cutover. Generated from
    # infra/tenants.yaml; `gen-tenants.py --check` fails if they disagree.
    # A TENANT MISSING HERE IS INVISIBLE IN GRAFANA while still being
    # written, which is the quietest way to lose a team's telemetry.
    secureJsonData:
      httpHeaderValue1: 'platform|unattributed|gudangsolusi|anonymous'

  # Live tailing ONLY. Loki returns HTTP 400 from /loki/api/v1/tail when more
  # than one tenant is in the header - documented and unconditional - so the
  # federated `loki` datasource above cannot serve Explore's Live button.
  #
  # Pinned to the catch-all because that is where anything not yet routed lands,
  # which is the common case for the "tail my service while I reproduce this"
  # workflow. Tailing a routed team's logs means switching tenant here.
  #
  # Deliberately referenced by nothing: no dashboard, no derived field, no alert
  # rule. It exists for interactive use in Explore and must stay that way, or a
  # panel silently starts showing one tenant's logs while claiming to show all.
  - name: Loki (live tail)
    uid: loki-tail
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: 'unattributed'
