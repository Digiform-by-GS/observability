apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: Observability
    folderUid: observability
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
