# Alerts on the platform's own health, from the metrics the collector now
# scrapes off Mimir, Loki, Tempo, Pyroscope and itself.
#
# These answer the question the service-level rules structurally cannot: is the
# observability stack itself working? Every other dashboard and alert in this
# system is built from data that arrives through this pipeline, so when the
# pipeline breaks, everything else goes quiet and looks healthy.
#
# Label names below were read off the live series, not assumed:
#   collector self-metrics carry `exporter` and `data_type`
#   every scraped target carries `service_instance_id` (mimir:9009, loki:3100, ...)
apiVersion: 1

groups:
  - orgId: 1
    name: platform-internal
    folder: Observability
    interval: 1m
    rules:
      # The most basic question, and previously unanswerable: is it still there?
      - uid: platform-backend-down
        title: Platform component is not responding
        condition: THRESHOLD
        for: 2m
        annotations:
          summary: "{{ $labels.service_instance_id }} is not responding to scrapes"
          description: >-
            The collector cannot reach this component. If it is a backend,
            whichever signal it stores is being dropped right now; if it is the
            collector itself, all four are. Check `docker compose ps` and the
            container's logs. Note that a component can be up and still be
            failing writes - the discard rules cover that case separately.
        labels:
          severity: critical
          signal: platform
        data:
          - refId: UP
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: UP
              instant: true
              expr: up
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: UP
              conditions:
                - evaluator: { type: lt, params: [1] }
        # NoData is meaningful here: if the series vanishes entirely, the
        # collector has stopped scraping, which is itself the outage.
        noDataState: Alerting
        execErrState: Error

      # If the collector cannot export, telemetry is being destroyed. Nothing
      # downstream can report this, because nothing downstream is receiving it.
      - uid: platform-collector-export-failing
        title: Collector is failing to export telemetry
        condition: THRESHOLD
        for: 5m
        annotations:
          summary: "Collector cannot deliver {{ $labels.data_type }} to {{ $labels.exporter }}"
          description: >-
            Signals are being dropped between the collector and the backend.
            Everything that depends on this data - dashboards, the other alerts
            in this folder, the verify skill - will look calm while it happens,
            because they are all downstream of this pipeline. Check the target
            backend is up and that the collector's queue is not saturated.
        labels:
          severity: critical
          signal: platform
        data:
          - refId: FAILED
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: FAILED
              instant: true
              # Regex match rather than named metrics: these counters only come
              # into existence on the first failure, so naming them explicitly
              # would leave the rule in NoData until the day it matters and
              # give no chance to notice it was never wired up.
              expr: sum by (exporter, data_type) (rate({__name__=~"otelcol_exporter_send_failed_.+"}[5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: FAILED
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error

      # Backpressure, before it becomes loss. The queue filling is the warning
      # that the export failures above are about to start.
      - uid: platform-collector-queue-saturating
        title: Collector export queue is filling up
        condition: THRESHOLD
        for: 10m
        annotations:
          summary: "{{ $labels.exporter }} queue is {{ humanizePercentage $value }} full"
          description: >-
            The collector is accepting telemetry faster than the backend takes
            it. When the queue fills, new data is dropped. This is the early
            warning for 'Collector is failing to export' - a backend is likely
            slow or struggling rather than down.
        labels:
          severity: warning
          signal: platform
        data:
          - refId: RATIO
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: RATIO
              instant: true
              expr: >-
                sum by (exporter) (otelcol_exporter_queue_size)
                / clamp_min(sum by (exporter) (otelcol_exporter_queue_capacity), 1)
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        noDataState: OK
        execErrState: Error

      # A backend can be up and still refusing writes - over a limit, malformed
      # data, or a tenant past its cap. That is invisible from `up` alone.
      - uid: platform-writes-discarded
        title: A backend is discarding writes
        condition: THRESHOLD
        for: 5m
        annotations:
          summary: "Writes discarded for {{ $labels.user }}{{ $labels.tenant }} ({{ $labels.reason }})"
          description: >-
            Mimir, Loki or Tempo is rejecting data it was sent, for the tenant
            named in the labels. The usual cause is that tenant passing a limit
            in infra/tenants.yaml. Since tenancy landed the blast radius is the
            one tenant rather than the whole platform, so this is no longer
            automatically everyone's problem - but it is still total data loss
            for whoever owns it. `reason` says which limit.
        labels:
          severity: critical
          signal: platform
        data:
          - refId: DISCARDED
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: DISCARDED
              instant: true
              # Same reasoning as the export-failure rule: these families do not
              # exist until the first discard occurs.
              # by (user, tenant, reason): Mimir labels the tenant `user`,
              # Loki and Tempo label it `tenant`, and all three carry `reason`.
              # Aggregating them away was acceptable when there was one tenant;
              # now it would hide WHOSE data is being dropped, which is the only
              # thing worth knowing here.
              expr: sum by (user, tenant, reason) (rate({__name__=~"cortex_discarded_samples_total|loki_discarded_samples_total|tempo_discarded_spans_total"}[5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: DISCARDED
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error

      # An OOM GUARD, not a fairness cap - that job moved to the per-tenant rule
      # below when tenancy landed. This one is about the total the box can hold
      # in Mimir's 2 GiB, which no per-tenant limit protects: the sum of the
      # per-tenant caps in infra/tenants.yaml can be raised past what the
      # hardware has, and the generator's budget check is the only thing that
      # normally prevents it.
      - uid: platform-mimir-series-cap
        title: Mimir total active series approaching what the box can hold
        condition: THRESHOLD
        for: 15m
        annotations:
          summary: "{{ $value }} active series across all tenants"
          description: >-
            This is the TOTAL across tenants, and it is about Mimir's memory
            rather than any one team's quota - past roughly 150k in a 2 GiB
            limit the ingester is at risk of being OOM-killed, which loses every
            tenant at once. Find the biggest contributor with
            topk(5, cortex_ingester_active_series). If one tenant dominates, its
            own cap alert should also be firing; if none is, the budget in
            infra/tenants.yaml has been over-allocated.
        labels:
          severity: critical
          signal: cardinality
        data:
          - refId: SERIES
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: SERIES
              instant: true
              # This sum is only correct because the collector's self-scrape
              # goes to exactly ONE tenant. cortex_ingester_memory_series is a
              # process-wide gauge, so if that scrape were ever routed to
              # several tenants the federated datasource would return one copy
              # per tenant and sum() would multiply it - firing this alert at a
              # fraction of the real number. Verified against the live platform:
              # sum by (__tenant_id__) returns a single series, from `platform`.
              expr: sum(cortex_ingester_memory_series)
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: SERIES
              # 70% of 150000 - the pilot's own health criterion.
              conditions:
                - evaluator: { type: gt, params: [105000] }
        noDataState: OK
        execErrState: Error

      # THE alert this whole tenancy project exists to make possible. Before it,
      # the only cardinality signal was a single global number: by the time it
      # fired, writes were already being rejected for everyone, and finding who
      # caused it was a manual hunt. This names the team and fires while the
      # damage is still confined to them.
      #
      # A RATIO rather than an absolute, because the caps differ per tenant
      # (infra/tenants.yaml) - unattributed is allowed 30k and platform 10k, so
      # one threshold could not be right for both.
      - uid: platform-tenant-series-cap
        title: A tenant is approaching its own series cap
        condition: THRESHOLD
        for: 15m
        annotations:
          summary: "{{ $labels.user }} is at {{ humanizePercentage $value }} of its series cap"
          description: >-
            This tenant is close to the limit set for it in infra/tenants.yaml.
            Past it Mimir rejects ITS metric writes with a 4xx - other tenants
            are unaffected, which is the point of tenancy, but this team loses
            metrics entirely and their dashboards go blank.
            Usual cause is unbounded label values: an un-templated HTTP route,
            an id used as a metric label, or a version string that changes per
            deploy. Find it with
            topk(10, count by (__name__) ({__name__=~".+"})) read as that tenant.
            Either fix the cardinality or raise their cap in the manifest - the
            generator will refuse the raise if the box cannot hold it.
        labels:
          severity: warning
          signal: cardinality
        data:
          - refId: RATIO
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: RATIO
              instant: true
              # cortex_limits_overrides comes from Mimir's overrides-exporter,
              # which publishes ONLY for tenants with an explicit runtime-config
              # entry - hence gen-tenants.py writing one for every tenant even
              # when it equals the default. Without that, a tenant on defaults
              # would silently have no alert at all.
              expr: >-
                max by (user) (cortex_ingester_active_series)
                / on (user) group_left
                max by (user) (cortex_limits_overrides{limit_name="max_global_series_per_user"})
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        noDataState: OK
        execErrState: Error

      # The routing table matches team names exactly (case-insensitively).
      # Anything it does not match lands in the catch-all, silently and
      # correctly - which means a service whose `team` attribute is misspelled,
      # missing, or not yet in infra/tenants.yaml looks completely healthy while
      # sharing a quota with every other unrouted service.
      #
      # There is no error to detect. A rising catch-all is the only symptom, so
      # it is the only available alarm for a botched onboarding.
      - uid: platform-catchall-growing
        title: Telemetry is accumulating in the catch-all tenant
        condition: THRESHOLD
        for: 30m
        annotations:
          summary: "unattributed holds {{ $value }} active series and is growing"
          description: >-
            Some service is sending telemetry with no `team` resource attribute,
            or with one that is not in infra/tenants.yaml. It is being accepted
            and stored under the shared catch-all quota rather than that team's.
            Nothing is broken, which is why this needs an alert rather than an
            error. Identify it with
            count by (service_name) (up{}) read as the unattributed tenant, then
            either set OTEL_RESOURCE_ATTRIBUTES=team=<x> on that service or add
            the team to the manifest.
        labels:
          severity: warning
          signal: tenancy
        data:
          - refId: GROWTH
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: GROWTH
              instant: true
              # Growth over an hour, not an absolute: the catch-all legitimately
              # holds browser RUM and the verify skill's own pushes forever, so
              # a steady population is expected and only a climb is a signal.
              expr: >-
                max by (user) (cortex_ingester_active_series{user="unattributed"})
                - min by (user) (min_over_time(cortex_ingester_active_series{user="unattributed"}[1h]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: GROWTH
              conditions:
                - evaluator: { type: gt, params: [500] }
        noDataState: OK
        execErrState: Error

      # The generator can stop dead while everything else looks perfectly
      # healthy. It is not in the ingest path, so traces keep arriving and being
      # stored; it logs nothing when it produces nothing; and every dashboard it
      # feeds simply renders empty, which is indistinguishable from an idle
      # platform. It stopped for six days and was found by accident.
      #
      # The cause was a per-tenant Tempo overrides entry: such an entry REPLACES
      # the entire defaults object for that tenant, so an entry naming only
      # `ingestion` also wiped `metrics_generator.processors`.
      #
      # Deliberately conditioned on spans arriving. Zero generated series is
      # correct on an idle platform; zero generated series WHILE spans are being
      # received is not.
      - uid: platform-generator-silent
        title: Tempo is receiving spans but generating no metrics
        condition: THRESHOLD
        for: 15m
        annotations:
          summary: "Spans are arriving but the metrics generator is producing nothing"
          description: >-
            Every RED dashboard, the service graph, Blast Radius and all
            exemplars are fed by this. They are blank right now, and nothing
            else will tell you: ingest is unaffected, traces are still queryable,
            and no error is logged.
            First thing to check is whether a tenant has an entry in a
            per-tenant Tempo overrides file. Such an entry replaces the WHOLE
            defaults object, so one naming only `ingestion` silently removes
            metrics_generator.processors and disables generation for that tenant.
            Confirm with tempo_metrics_generator_registry_active_series by tenant
            - a tenant receiving spans with no series there is the one affected.
        labels:
          severity: critical
          signal: platform
        data:
          - refId: SILENT
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: SILENT
              instant: true
              # Spans arriving (>0) while generated series are absent or zero.
              # `or vector(0)` keeps the expression defined when the generator
              # metric does not exist at all - which is precisely the broken
              # state, and would otherwise evaluate to no-data and never fire.
              expr: >-
                (sum(rate(tempo_distributor_spans_received_total[10m])) > 0)
                and
                (sum(tempo_metrics_generator_registry_active_series) or vector(0)) < 1
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: SILENT
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
