# Where alerts go, and how they are grouped.
#
# The webhook URL is NOT in this file. It is read from the DISCORD_WEBHOOK_URL
# environment variable, which is set in .env (gitignored) and passed to the
# Grafana container by docker-compose.platform.yml. A Discord webhook is a
# credential — anyone holding it can post to the channel — and this repository
# is public.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord-primary
        type: discord
        settings:
          url: $__env{DISCORD_WEBHOOK_URL}
          # Grafana's default title expands every label into the title and then
          # truncates at 256 runes - observed live as
          # `msg="Truncated title" max_runes=256`, which arrives in Discord cut
          # off mid-sentence. The scraped platform targets make this worse,
          # because the prometheus receiver attaches otel_scope_name,
          # url_scheme, server_address and friends to every series.
          #
          # A fixed short title keeps the headline readable; the detail is in
          # the message body below.
          title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
          # Discord hard-caps a message at 2000 characters and silently
          # rejects anything longer, so this stays deliberately compact: what
          # fired, on which service, and the one line that says what to do.
          # The full description lives in Grafana, one click away.
          #
          # The subject is named by a different label depending on the rule:
          # service-level alerts carry `service`, platform ones carry
          # `service_instance_id` (mimir:9009, ...). Handle both, or half the
          # alerts arrive without saying what they are about.
          message: |
            {{ range .Alerts }}{{ if .Labels.service }}`{{ .Labels.service }}` — {{ else if .Labels.service_instance_id }}`{{ .Labels.service_instance_id }}` — {{ end }}{{ .Annotations.summary }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: discord
    # Group by alert AND service: one noisy service must not suppress the same
    # alert firing for a different one, which is what grouping on alertname
    # alone would do.
    group_by:
      - alertname
      - service
    # Wait for siblings before the first notification — a platform-wide problem
    # arrives as one message naming every affected service rather than a burst.
    group_wait: 30s
    group_interval: 5m
    # Re-notify only every 4h for anything still firing; more often than that
    # and people learn to mute the channel, which is worse than no alert.
    repeat_interval: 4h
    routes:
      - receiver: discord
        matchers:
          - severity = critical
        # A service that has gone silent, or a series count about to get every
        # tenant's writes rejected, is worth interrupting for: notify almost
        # immediately and keep reminding hourly until it is dealt with.
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
