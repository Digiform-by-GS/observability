# Where alerts go, and how they are grouped.
#
# The webhook URL is NOT in this file. It is read from the DISCORD_WEBHOOK_URL
# environment variable, which is set in .env (gitignored) and passed to the
# Grafana container by docker-compose.platform.yml. A Discord webhook is a
# credential — anyone holding it can post to the channel — and this repository
# is public.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord-primary
        type: discord
        settings:
          url: $__env{DISCORD_WEBHOOK_URL}
          # Discord hard-caps a message at 2000 characters and silently
          # rejects anything longer, so this stays deliberately compact: what
          # fired, on which service, and the one line that says what to do.
          # The full description lives in Grafana, one click away.
          message: |
            {{ range .Alerts }}**{{ .Labels.alertname }}**{{ if .Labels.service }} — `{{ .Labels.service }}`{{ end }}
            {{ .Annotations.summary }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: discord
    # Group by alert AND service: one noisy service must not suppress the same
    # alert firing for a different one, which is what grouping on alertname
    # alone would do.
    group_by:
      - alertname
      - service
    # Wait for siblings before the first notification — a platform-wide problem
    # arrives as one message naming every affected service rather than a burst.
    group_wait: 30s
    group_interval: 5m
    # Re-notify only every 4h for anything still firing; more often than that
    # and people learn to mute the channel, which is worse than no alert.
    repeat_interval: 4h
    routes:
      - receiver: discord
        matchers:
          - severity = critical
        # A service that has gone silent, or a series count about to get every
        # tenant's writes rejected, is worth interrupting for: notify almost
        # immediately and keep reminding hourly until it is dealt with.
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
