[analytics]
reporting_enabled = false
check_for_updates = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin

[auth]
disable_login_form = true

[users]
default_theme = dark

[log]
level = info

[feature_toggles]
enable = traceqlEditor traceToMetrics

[security]
# Grafana defaults this to false and then sends `X-Frame-Options: deny`, so any
# <iframe> of a panel renders blank with nothing logged anywhere - the failure
# mode is a page that looks broken rather than an error that says why.
#
# Turned on so services/platform-ui can embed /d-solo/ panels. The exposure this
# adds is clickjacking, not data access: a parent page still cannot READ a
# cross-origin frame, it can only overlay it. With anonymous access pinned to
# Viewer on the shared deployment (see docker-compose.platform.yml) there is no
# destructive control to trick a visitor into clicking.
#
# To restrict WHICH origins may frame Grafana, enable the CSP below and put your
# UI's origin in frame-ancestors. Left off by default because a malformed
# template breaks Grafana's own UI, and the host must be known in advance:
#   content_security_policy = true
#   content_security_policy_template = """frame-ancestors 'self' https://ui.example.com;"""
allow_embedding = true
