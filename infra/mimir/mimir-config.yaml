# alertmanager dropped: Grafana owns alerting (infra/grafana/provisioning/alerting),
# the prometheus datasource sets manageAlerts:false, and nothing queries Mimir's
# alertmanager. It was never part of `all` - it was added explicitly - and
# removing it reclaims memory for the per-tenant TSDBs below, each of which
# carries its own head block, WAL, index and block stream.
#
# overrides-exporter was already here with nothing to export; runtime_config
# below is what finally gives it per-tenant limits to publish.
target: all,overrides-exporter

# Partition metrics by tenant, read from X-Scope-OrgID.
#
# MUST NOT LAND BEFORE TEMPO'S multitenancy_enabled. Tempo's metrics generator
# only sends an org header in multi-tenant mode, so enabling this first makes
# every span-metric and service-graph write 401 - silently, because the
# collector is not in that write path and no alert watches it.
multitenancy_enabled: true

# Let one query span several tenants, which is what keeps a single shared
# Grafana working: the datasources send a pipe-separated tenant list and results
# gain a __tenant_id__ label.
#
# max_concurrent is 4, not the default 16. Every federated query fans out into
# one sub-query per tenant; Platform Health alone has 15 Prometheus targets, so
# the default would turn one dashboard refresh into 90 concurrent sub-queries on
# a 2 vCPU box shared with every backend it is querying.
tenant_federation:
  enabled: true
  max_concurrent: 4

# Per-tenant limits, hot-reloaded on this period - no restart. Generated from
# infra/tenants.yaml by scripts/gen-tenants.py; the loader is strict, so an
# unknown key is a hard failure rather than a warning.
runtime_config:
  file: /etc/mimir/runtime.yaml
  period: 10s

server:
  http_listen_port: 9009
  log_level: info

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/common

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 1

ruler:
  rule_path: /data/ruler-working
  alertmanager_url: http://localhost:9009/alertmanager

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler-storage

alertmanager:
  data_dir: /data/alertmanager-working
  external_url: http://localhost:9009/alertmanager
  sharding_ring:
    replication_factor: 1

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager-storage

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  native_histograms_ingestion_enabled: true
  # Exemplar storage defaults to 0 (disabled), which silently DROPS the exemplars
  # Tempo's metrics generator sends (`send_exemplars: true` in tempo-config.yaml).
  # Without this, the Grafana "metric → example trace" link can never fire.
  max_global_exemplars_per_user: 100000
  # Cardinality guardrails. Nothing previously stood between a labelling mistake
  # and an OOM. Three things newly arm that risk: per-queue RabbitMQ metrics,
  # un-templated HTTP span names (use otelchi/otelgin, not bare otelhttp), and
  # `resource_to_telemetry_conversion: enabled` in the collector, which promotes
  # EVERY resource attribute to a metric label.
  # A limit that rejects loudly beats silent unbounded growth: writes over the
  # cap fail with HTTP 4xx and surface in the collector log, rather than
  # quietly eating Mimir's memory.
  # Long-term retention for metric blocks. Unset, Mimir defaults to 0s, which
  # means KEEP FOREVER — Loki and Tempo were both given 168h and this was
  # silently left infinite, so metrics were the one signal that grew without
  # bound on a local disk.
  #
  # 30d rather than 168h on purpose: metrics are what dashboards and capacity
  # trending read weeks later, and they are the cheapest signal per sample.
  # Sizing at the cap above: 150k series x 1 sample/15s is ~864M samples/day,
  # ~1.1 GB/day compressed, so 30d is ~33 GB — comfortable on a 197 GB disk.
  # Raising this is a deliberate disk-budget decision, not a default to drift.
  #
  # Not to be confused with blocks_storage.tsdb.retention_period (13h), which
  # is only how long the ingester holds blocks locally before shipping them.
  compactor_blocks_retention_period: 30d
  max_global_series_per_user: 150000
  max_global_series_per_metric: 20000
  max_label_names_per_series: 30

usage_stats:
  enabled: false
