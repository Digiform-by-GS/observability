target: all,alertmanager,overrides-exporter

multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: info

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/common

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 1

ruler:
  rule_path: /data/ruler-working
  alertmanager_url: http://localhost:9009/alertmanager

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler-storage

alertmanager:
  data_dir: /data/alertmanager-working
  external_url: http://localhost:9009/alertmanager
  sharding_ring:
    replication_factor: 1

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager-storage

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  native_histograms_ingestion_enabled: true
  # Exemplar storage defaults to 0 (disabled), which silently DROPS the exemplars
  # Tempo's metrics generator sends (`send_exemplars: true` in tempo-config.yaml).
  # Without this, the Grafana "metric → example trace" link can never fire.
  max_global_exemplars_per_user: 100000
  # Cardinality guardrails. Nothing previously stood between a labelling mistake
  # and an OOM. Three things newly arm that risk: per-queue RabbitMQ metrics,
  # un-templated HTTP span names (use otelchi/otelgin, not bare otelhttp), and
  # `resource_to_telemetry_conversion: enabled` in the collector, which promotes
  # EVERY resource attribute to a metric label.
  # A limit that rejects loudly beats silent unbounded growth: writes over the
  # cap fail with HTTP 4xx and surface in the collector log, rather than
  # quietly eating Mimir's memory.
  max_global_series_per_user: 150000
  max_global_series_per_metric: 20000
  max_label_names_per_series: 30

usage_stats:
  enabled: false
